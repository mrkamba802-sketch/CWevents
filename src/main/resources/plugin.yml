name: CWevents
version: 1.0.0
main: me.clacyworld.cwevents.CWevents
api-version: '1.21'
author: ClacyWorld
description: Автоматический ивент «Воздушный конвой» с охраной, боссом и настраиваемыми наградами.
commands:
  cwevents:
    description: Управление ивентом «Воздушный конвой».
    usage: /cwevents <start|stop|status|reload|setlocation>
    aliases: [cwevent, cwe]
permissions:
  cwevents.admin:
    description: Полный доступ к управлению CWevents и обходу ограничений зоны ивента.
    default: op
  cwevents.use:
    description: Просмотр статуса ивента.
    default: true